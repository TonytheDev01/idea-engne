<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Idea-Engne app icon</title>
  <desc id="desc">A rounded-square purple app icon with a clean cyan and violet idea bulb and neural spark symbol.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24104D"/>
      <stop offset="1" stop-color="#4D25B9"/>
    </linearGradient>
    <linearGradient id="bulb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#BCEEFF"/>
      <stop offset="1" stop-color="#21C8E8"/>
    </linearGradient>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#tile)"/>

  <!-- Lightbulb silhouette -->
  <path d="M256 91
    C171 91 112 153 112 230
    C112 283 141 317 178 351
    C197 369 207 391 209 414
    H303
    C305 391 315 369 334 351
    C371 317 400 283 400 230
    C400 153 341 91 256 91Z"
    fill="none" stroke="url(#bulb)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural / idea mark -->
  <path d="M256 155 V310
    M256 177
    C232 153 198 174 198 202
    C198 220 211 231 226 239
    C237 245 242 256 242 270
    M256 177
    C280 153 314 174 314 202
    C314 220 301 231 286 239
    C275 245 270 256 270 270"
    fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M216 207 L239 228 L216 249 M296 207 L273 228 L296 249"
    fill="none" stroke="#27D0EB" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="228" r="9" fill="#F97316"/>

  <!-- Base -->
  <path d="M216 437 H296 M225 463 H287"
    fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round"/>

  <!-- Small spark accents -->
  <path d="M256 47 V68 M147 91 L163 107 M365 91 L349 107"
    fill="none" stroke="#F97316" stroke-width="13" stroke-linecap="round"/>
  <circle cx="256" cy="47" r="5" fill="#FFFFFF"/>
</svg>
